[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lobster-phone-agent"
version = "0.3.0rc1"
description = "Split control-plane and private skill bridge for semantic Android automation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "ckbkdj" }]
keywords = ["appium", "android", "agent", "openclaw", "websocket", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "jsonschema>=4.23,<5.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "PyYAML>=6.0,<7.0",
  "rapidfuzz>=3.13,<4.0",
  "uvicorn[standard]>=0.35,<1.0",
  "websockets>=15.0,<17.0",
]

[project.optional-dependencies]
skill = ["Appium-Python-Client>=6.0,<7.0"]
a2a = ["a2a-sdk[http-server]>=1.0,<2.0"]
edge = [
  "numpy>=2.0,<3.0",
  "onnxruntime>=1.22,<2.0",
  "tokenizers>=0.21,<1.0",
]
dev = [
  "mypy>=1.16,<2.0",
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
  "build>=1.2,<2.0",
  "setuptools>=77",
  "wheel",
]

[project.scripts]
auto-phone-control = "lobster_phone_agent.main:run"
auto-phone-skill = "lobster_phone_agent.skill.cli:run"
lobster-phone-agent = "lobster_phone_agent.main:run"
lobster-phone-skill = "lobster_phone_agent.skill.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lobster_phone_agent = ["resources/config/*.yaml", "resources/config/recipes/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lobster_phone_agent"]
warn_unused_ignores = false
