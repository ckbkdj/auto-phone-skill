id: open_app
description: Open an installed app.
priority: 10
patterns:
  - '^(?:请)?(?:帮我)?(?:打开|启动|进入)(?P<app>.+?)(?:app|应用)?$'
target_app: '{app}'
metadata:
  category: launch
steps:
  - id: launch_app
    action: launch_app
    value: '{app}'
    description: 打开{app}
    timeout_ms: 5000
  - id: finish
    action: finish
    value:
      app: '{app}'
