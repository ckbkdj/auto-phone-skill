services:
  phone-agent:
    build:
      context: ..
      dockerfile: Dockerfile
    image: lobster-phone-agent-control-plane:0.2.0rc2
    container_name: lobster-phone-agent-control-plane
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PHONE_AGENT_HOST: 0.0.0.0
      PHONE_AGENT_PORT: 8788
      PHONE_AGENT_PRODUCTION_MODE: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8788"
    volumes:
      - ../config:/app/config:ro
      - ../artifacts:/app/artifacts
    networks:
      - control
      - egress
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    container_name: lobster-phone-agent-caddy
    restart: unless-stopped
    depends_on:
      phone-agent:
        condition: service_healthy
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - control
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  egress:
  control:
    internal: true

volumes:
  caddy_data:
  caddy_config:
