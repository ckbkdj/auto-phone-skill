id: app_search
description: Search inside an app using a generic semantic flow.
priority: 40
patterns:
  - '^(?:请)?(?:帮我)?在(?P<app>.+?)(?:里|中|上)?(?:搜索|搜|查找)(?P<query>.+)$'
target_app: '{app}'
metadata:
  category: generic_search
steps:
  - id: launch_app
    action: launch_app
    value: '{app}'
    description: 打开{app}
    timeout_ms: 5000
  - id: tap_search
    action: tap
    description: 打开搜索
    target:
      text: 搜索
      aliases: [搜一搜, 搜索框, 查找, search]
      role: input
      allow_partial: true
    timeout_ms: 4000
  - id: type_query
    action: type
    description: 输入搜索内容
    target:
      text: 搜索
      aliases: [搜一搜, 搜索框, 查找, search]
      role: input
      allow_partial: true
    value: '{query}'
    metadata:
      clear_first: true
    timeout_ms: 3500
  - id: submit_search
    action: tap
    description: 提交搜索
    target:
      text: 搜索
      aliases: [搜索, 查找, search, 完成]
      role: button
      allow_partial: true
    optional: true
    timeout_ms: 2500
  - id: finish
    action: finish
    value:
      app: '{app}'
      query: '{query}'
