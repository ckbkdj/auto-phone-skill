id: meituan_ride
description: Use Meituan to prepare and, after confirmation, submit a ride request.
priority: 100
patterns:
  - '^(?:请)?(?:帮我)?(?:用|打开)?美团(?:打车)?(?:去|到)(?P<destination>.+)$'
  - '^(?:请)?(?:帮我)?在美团(?:里|上)?打车(?:去|到)(?P<destination>.+)$'
target_app: 美团
target_package: com.sankuai.meituan
metadata:
  category: ride_hailing
  deterministic: true
steps:
  - id: launch_meituan
    action: launch_app
    description: 打开美团
    value: 美团
    expect:
      - kind: package_contains
        value: sankuai
    timeout_ms: 5000
  - id: enter_ride
    action: tap
    description: 进入美团打车
    target:
      text: 打车
      aliases: [美团打车, 出行, 打车出行]
      role: button
    timeout_ms: 3500
    retry:
      max_attempts: 3
      delay_ms: 180
      allow_repair: true
  - id: tap_destination
    action: tap
    description: 打开目的地输入框
    target:
      text: 你要去哪儿
      aliases: [输入目的地, 请输入目的地, 终点, 去哪里, 想去哪]
      role: input
    timeout_ms: 3500
  - id: type_destination
    action: type
    description: 输入目的地
    target:
      text: 你要去哪儿
      aliases: [输入目的地, 请输入目的地, 终点, 去哪里, 想去哪]
      role: input
    value: '{destination}'
    metadata:
      clear_first: true
    expect:
      - kind: text_present
        value: '{destination}'
    timeout_ms: 3500
  - id: choose_destination
    action: tap
    description: 选择目的地搜索结果
    target:
      text: '{destination}'
      aliases: ['{destination}']
      allow_partial: true
      index: 0
    timeout_ms: 5000
  - id: submit_ride
    action: tap
    description: 提交叫车请求
    target:
      text: 呼叫
      aliases: [确认呼叫, 立即叫车, 现在用车, 确认用车, 立即呼叫]
      role: button
      allow_partial: true
    risk: high
    confirmation_text: '即将向美团提交前往“{destination}”的叫车请求，可能产生费用。'
    timeout_ms: 5000
  - id: finish
    action: finish
    description: 已提交叫车流程
    value:
      destination: '{destination}'
      app: 美团
success:
  - kind: any
    children:
      - kind: text_present
        value: 司机
      - kind: text_present
        value: 等待接驾
      - kind: text_present
        value: 正在呼叫
