id: didi_ride
description: Use DiDi to prepare and, after confirmation, submit a ride request.
priority: 100
patterns:
  - '^(?:请)?(?:帮我)?(?:用|打开)?滴滴(?:出行|打车)?(?:去|到)(?P<destination>.+)$'
  - '^(?:请)?(?:帮我)?在滴滴(?:里|上)?打车(?:去|到)(?P<destination>.+)$'
target_app: 滴滴出行
target_package: com.sdu.didi.psnger
metadata:
  category: ride_hailing
  deterministic: true
steps:
  - id: launch_didi
    action: launch_app
    description: 打开滴滴出行
    value: 滴滴出行
    timeout_ms: 5000
  - id: tap_destination
    action: tap
    description: 打开目的地输入框
    target:
      text: 你要去哪儿
      aliases: [输入目的地, 请输入目的地, 终点, 去哪里]
      role: input
    timeout_ms: 3500
  - id: type_destination
    action: type
    description: 输入目的地
    target:
      text: 你要去哪儿
      aliases: [输入目的地, 请输入目的地, 终点, 去哪里]
      role: input
    value: '{destination}'
    metadata:
      clear_first: true
    timeout_ms: 3500
  - id: choose_destination
    action: tap
    description: 选择目的地
    target:
      text: '{destination}'
      aliases: ['{destination}']
      allow_partial: true
      index: 0
    timeout_ms: 5000
  - id: submit_ride
    action: tap
    description: 确认呼叫车辆
    target:
      text: 确认呼叫
      aliases: [呼叫, 立即叫车, 确认用车, 现在用车]
      role: button
      allow_partial: true
    risk: high
    confirmation_text: '即将向滴滴提交前往“{destination}”的叫车请求，可能产生费用。'
    timeout_ms: 5000
  - id: finish
    action: finish
    value:
      destination: '{destination}'
      app: 滴滴出行
