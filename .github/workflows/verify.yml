name: Candidate verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tested source
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/auto-phone-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: ${{ runner.temp }}/auto-phone-source.zip
          retention-days: 7
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,skill]'
      - name: Core verification
        run: python scripts/release_gate.py --core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.python }}
          path: |
            artifacts/core-gate.json
            artifacts/coverage.json
            dist/*.whl
            contracts/*.json
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t auto-phone-control:verify .
      - name: Container import and configuration
        run: |
          docker run --rm --entrypoint python auto-phone-control:verify -c 'from lobster_phone_agent.app import create_app; from lobster_phone_agent.config import Settings; create_app(Settings()); print("container import OK")'
          cp .env.example .env
          docker compose -f deploy/docker-compose.yml config --quiet
          docker run --rm -e PHONE_AGENT_DOMAIN=phone.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
