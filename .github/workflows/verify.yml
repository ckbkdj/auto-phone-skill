name: Skill and MCP verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Independent schema validator (tests only)
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Test code, protocol and independent processes
        run: python -m unittest discover -s tests -v
      - name: Run without third-party packages
        run: python -I -S scripts/phone_agent.py doctor --json '{}'
      - name: Package installable Skill ZIP
        run: python scripts/package_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: auto-phone-skill-${{ matrix.python-version }}
          path: dist/*
